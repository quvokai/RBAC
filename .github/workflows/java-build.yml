name: Java CI - Compile & Test

on:
  push:
    branches: [ dev, main, feature/* ]
  pull_request:
    branches: [ dev, main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Compile main code
        run: find src/main/java -name "*.java" -print0 | xargs -0 javac

      - name: Compile tests
        run: |
          if [ -d src/test/java ]; then
            find src/test/java -name "*.java" -print0 | xargs -0 javac -cp "src/main/java:lib/*"
          else
            echo "No tests found"
          fi

      - name: Run tests
        run: |
          if [ -f lib/junit-platform-console-standalone-1.10.3.jar ]; then
            java -jar lib/junit-platform-console-standalone-1.10.3.jar --scan-classpath
          else
            echo "JUnit standalone JAR not found in lib/"
          fi