name: Java CI - Compile & Test

on:
  push:
    branches: [ dev, main, feature/* ]
  pull_request:
    branches: [ dev, main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Download JUnit Standalone JAR
        run: wget -O junit.jar https://repo1.maven.org/maven2/org/junit/platform/junit-platform-console-standalone/1.10.3/junit-platform-console-standalone-1.10.3.jar

      - name: Compile main code
        run: find src/main/java -name "*.java" -print0 | xargs -0 javac

      - name: Compile test code
        run: find src/test/java -name "*.java" -print0 | xargs -0 javac -cp src/main/java:junit.jar

      - name: Run tests
        run: java -jar junit.jar --scan-classpath